name = "saharsa-news-api"
main = "src/index.js"
compatibility_date = "2026-08-04"
workers_dev = true

[observability]
enabled = true

[vars]
SITE_NAME = "Saharsa News"
AI_MODEL = "gemini-2.5-flash"

[triggers]
crons = ["17 * * * *"]

